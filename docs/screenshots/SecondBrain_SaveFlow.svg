<svg width="100%" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Second Brain save flow — animated pipeline</title>
  <desc>Save flow showing user input through HydraDB indexing poll to confirmed response, with animated pulse highlighting each step in sequence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      @keyframes pulse1 { 0%,100%{opacity:0} 10%,18%{opacity:1} }
      @keyframes pulse2 { 0%,100%{opacity:0} 22%,30%{opacity:1} }
      @keyframes pulse3 { 0%,100%{opacity:0} 34%,42%{opacity:1} }
      @keyframes pulse4 { 0%,100%{opacity:0} 46%,56%{opacity:1} }
      @keyframes pulse5 { 0%,100%{opacity:0} 60%,72%{opacity:1} }
      @keyframes pulse6 { 0%,100%{opacity:0} 76%,88%{opacity:1} }
      @keyframes travela1 { 0%,100%{stroke-dashoffset:40} 18%,22%{stroke-dashoffset:0} }
      @keyframes travela2 { 0%,100%{stroke-dashoffset:40} 30%,34%{stroke-dashoffset:0} }
      @keyframes travela3 { 0%,100%{stroke-dashoffset:40} 42%,46%{stroke-dashoffset:0} }
      @keyframes travela4 { 0%,100%{stroke-dashoffset:40} 56%,60%{stroke-dashoffset:0} }
      @keyframes travela5 { 0%,100%{stroke-dashoffset:40} 72%,76%{stroke-dashoffset:0} }
      .p1{animation:pulse1 9s ease-in-out infinite}
      .p2{animation:pulse2 9s ease-in-out infinite}
      .p3{animation:pulse3 9s ease-in-out infinite}
      .p4{animation:pulse4 9s ease-in-out infinite}
      .p5{animation:pulse5 9s ease-in-out infinite}
      .p6{animation:pulse6 9s ease-in-out infinite}
      .ta1{stroke-dasharray:40;animation:travela1 9s ease-in-out infinite}
      .ta2{stroke-dasharray:40;animation:travela2 9s ease-in-out infinite}
      .ta3{stroke-dasharray:40;animation:travela3 9s ease-in-out infinite}
      .ta4{stroke-dasharray:40;animation:travela4 9s ease-in-out infinite}
      .ta5{stroke-dasharray:40;animation:travela5 9s ease-in-out infinite}
    </style>
  </defs>

  <rect width="680" height="380" fill="#FDF6EE" rx="12"/>
  <text font-family="Georgia,serif" font-size="13" font-weight="700" fill="#712B13" x="340" y="32" text-anchor="middle">Save flow — indexing-aware ingestion</text>

  <!-- Step 1: User -->
  <rect x="30" y="55" width="108" height="52" rx="10" fill="#FDF0E4" stroke="#C97B3A" stroke-width="1"/>
  <text font-family="Georgia,serif" font-size="11" font-weight="700" fill="#712B13" x="84" y="75" text-anchor="middle">User</text>
  <text font-family="Georgia,serif" font-size="9" fill="#854F0B" x="84" y="90" text-anchor="middle">types or speaks</text>
  <text font-family="Georgia,serif" font-size="9" fill="#854F0B" x="84" y="102" text-anchor="middle">a memory</text>
  <rect class="p1" x="26" y="51" width="116" height="60" rx="13" fill="none" stroke="#C97B3A" stroke-width="2.5" opacity="0"/>

  <!-- Arrow 1 -->
  <line x1="138" y1="81" x2="176" y2="81" stroke="#D3D1C7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="ta1" x1="138" y1="81" x2="176" y2="81" stroke="#C97B3A" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 2: POST -->
  <rect x="178" y="55" width="128" height="52" rx="10" fill="#FDF0E4" stroke="#C97B3A" stroke-width="1"/>
  <text font-family="Georgia,serif" font-size="10" font-weight="700" fill="#712B13" x="242" y="73" text-anchor="middle">POST /api/memories</text>
  <text font-family="Georgia,serif" font-size="9" fill="#993C1D" x="242" y="89" text-anchor="middle">{ content: string }</text>
  <text font-family="Georgia,serif" font-size="9" fill="#854F0B" x="242" y="101" text-anchor="middle">Next.js route handler</text>
  <rect class="p2" x="174" y="51" width="136" height="60" rx="13" fill="none" stroke="#C97B3A" stroke-width="2.5" opacity="0"/>

  <!-- Arrow 2 -->
  <line x1="306" y1="81" x2="344" y2="81" stroke="#D3D1C7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="ta2" x1="306" y1="81" x2="344" y2="81" stroke="#C97B3A" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 3: addMemory -->
  <rect x="346" y="55" width="128" height="52" rx="10" fill="#E8F3EC" stroke="#3B6D11" stroke-width="1"/>
  <text font-family="Georgia,serif" font-size="10" font-weight="700" fill="#27500A" x="410" y="73" text-anchor="middle">addMemory()</text>
  <text font-family="Georgia,serif" font-size="9" fill="#3B6D11" x="410" y="89" text-anchor="middle">HydraDB ingest</text>
  <text font-family="Georgia,serif" font-size="9" fill="#3B6D11" x="410" y="101" text-anchor="middle">infer: false</text>
  <rect class="p3" x="342" y="51" width="136" height="60" rx="13" fill="none" stroke="#3B6D11" stroke-width="2.5" opacity="0"/>

  <!-- Arrow 3 -->
  <line x1="474" y1="81" x2="522" y2="81" stroke="#D3D1C7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="ta3" x1="474" y1="81" x2="522" y2="81" stroke="#3B6D11" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 4: HydraDB -->
  <rect x="524" y="55" width="116" height="52" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text font-family="Georgia,serif" font-size="11" font-weight="700" fill="#27500A" x="582" y="75" text-anchor="middle">HydraDB</text>
  <text font-family="Georgia,serif" font-size="9" fill="#3B6D11" x="582" y="91" text-anchor="middle">indexing...</text>
  <text font-family="Georgia,serif" font-size="9" fill="#3B6D11" x="582" y="103" text-anchor="middle">processing</text>
  <rect class="p4" x="520" y="51" width="124" height="60" rx="13" fill="none" stroke="#3B6D11" stroke-width="2.5" opacity="0"/>

  <!-- Poll loop container -->
  <rect x="178" y="148" width="420" height="150" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1" stroke-dasharray="6 3" opacity="0.7"/>
  <text font-family="Georgia,serif" font-size="10" font-style="italic" font-weight="600" fill="#993C1D" x="388" y="168" text-anchor="middle">polling loop — up to ~12 seconds</text>

  <!-- Arrow 4: down into poll -->
  <line x1="582" y1="107" x2="582" y2="148" stroke="#D3D1C7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="ta4" x1="582" y1="107" x2="582" y2="148" stroke="#3B6D11" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 5: Poll boxes -->
  <rect x="196" y="176" width="148" height="52" rx="10" fill="#FDF0E4" stroke="#C97B3A" stroke-width="1"/>
  <text font-family="Georgia,serif" font-size="10" font-weight="700" fill="#712B13" x="270" y="196" text-anchor="middle">verifyProcessing()</text>
  <text font-family="Georgia,serif" font-size="9" fill="#854F0B" x="270" y="212" text-anchor="middle">check index status</text>
  <text font-family="Georgia,serif" font-size="9" fill="#854F0B" x="270" y="224" text-anchor="middle">retry if not ready</text>

  <line x1="344" y1="202" x2="382" y2="202" stroke="#D3D1C7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="384" y="176" width="140" height="52" rx="10" fill="#FDF0E4" stroke="#C97B3A" stroke-width="1"/>
  <text font-family="Georgia,serif" font-size="10" font-weight="700" fill="#712B13" x="454" y="194" text-anchor="middle">status?</text>
  <text font-family="Georgia,serif" font-size="9" fill="#854F0B" x="454" y="210" text-anchor="middle">completed / success</text>
  <text font-family="Georgia,serif" font-size="9" fill="#854F0B" x="454" y="222" text-anchor="middle">graph_creation</text>

  <path d="M454 228 L454 268 L270 268 L270 228" fill="none" stroke="#D3C4A8" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text font-family="Georgia,serif" font-size="9" font-style="italic" fill="#993C1D" x="362" y="283" text-anchor="middle">not ready → retry</text>

  <rect class="p5" x="192" y="172" width="336" height="60" rx="13" fill="none" stroke="#C97B3A" stroke-width="2.5" opacity="0"/>

  <!-- Arrow 5: ready → response -->
  <line x1="454" y1="298" x2="454" y2="316" stroke="#D3D1C7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="ta5" x1="454" y1="298" x2="454" y2="316" stroke="#3B6D11" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <text font-family="Georgia,serif" font-size="9" font-style="italic" fill="#27500A" x="468" y="312">ready</text>

  <!-- Step 6: Response -->
  <rect x="294" y="318" width="320" height="44" rx="10" fill="#E8F3EC" stroke="#3B6D11" stroke-width="1"/>
  <text font-family="Georgia,serif" font-size="11" font-weight="700" fill="#27500A" x="454" y="338" text-anchor="middle">{ sourceId, status: "completed" }</text>
  <text font-family="Georgia,serif" font-size="9" fill="#3B6D11" x="454" y="354" text-anchor="middle">memory is now searchable</text>
  <rect class="p6" x="290" y="314" width="328" height="52" rx="13" fill="none" stroke="#3B6D11" stroke-width="2.5" opacity="0"/>

  <!-- Side note -->
  <text font-family="Georgia,serif" font-size="9" font-style="italic" fill="#B4B2A9" x="84" y="210" text-anchor="middle">most RAG stacks</text>
  <text font-family="Georgia,serif" font-size="9" font-style="italic" fill="#B4B2A9" x="84" y="224" text-anchor="middle">fire-and-forget here</text>
  <text font-family="Georgia,serif" font-size="9" font-style="italic" fill="#993C1D" x="84" y="238" text-anchor="middle">→ silent recall failure</text>
</svg>
