<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Second Brain ask flow — animated grounded recall</title>
  <desc>Ask flow with pulsing highlight showing each step: user question through HydraDB recall to grounding constraint to cited answer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      @keyframes pulse1{0%,100%{opacity:0}10%,18%{opacity:1}}
      @keyframes pulse2{0%,100%{opacity:0}22%,30%{opacity:1}}
      @keyframes pulse3{0%,100%{opacity:0}34%,44%{opacity:1}}
      @keyframes pulse4{0%,100%{opacity:0}48%,60%{opacity:1}}
      @keyframes pulse5{0%,100%{opacity:0}64%,76%{opacity:1}}
      @keyframes pulse6{0%,100%{opacity:0}80%,92%{opacity:1}}
      @keyframes ta1{0%,100%{stroke-dashoffset:40}18%,22%{stroke-dashoffset:0}}
      @keyframes ta2{0%,100%{stroke-dashoffset:40}30%,34%{stroke-dashoffset:0}}
      @keyframes ta3{0%,100%{stroke-dashoffset:40}44%,48%{stroke-dashoffset:0}}
      @keyframes ta4{0%,100%{stroke-dashoffset:40}60%,64%{stroke-dashoffset:0}}
      @keyframes ta5{0%,100%{stroke-dashoffset:40}76%,80%{stroke-dashoffset:0}}
      .p1{animation:pulse1 9s ease-in-out infinite}
      .p2{animation:pulse2 9s ease-in-out infinite}
      .p3{animation:pulse3 9s ease-in-out infinite}
      .p4{animation:pulse4 9s ease-in-out infinite}
      .p5{animation:pulse5 9s ease-in-out infinite}
      .p6{animation:pulse6 9s ease-in-out infinite}
      .ta1{stroke-dasharray:40;animation:ta1 9s ease-in-out infinite}
      .ta2{stroke-dasharray:40;animation:ta2 9s ease-in-out infinite}
      .ta3{stroke-dasharray:40;animation:ta3 9s ease-in-out infinite}
      .ta4{stroke-dasharray:40;animation:ta4 9s ease-in-out infinite}
      .ta5{stroke-dasharray:40;animation:ta5 9s ease-in-out infinite}
    </style>
  </defs>

  <rect width="680" height="360" fill="#FDF6EE" rx="12"/>
  <text font-family="Georgia,serif" font-size="13" font-weight="700" fill="#0C447C" x="340" y="32" text-anchor="middle">Ask flow — grounded recall</text>

  <!-- Step 1: User -->
  <rect x="30" y="55" width="108" height="52" rx="10" fill="#FDF0E4" stroke="#C97B3A" stroke-width="1"/>
  <text font-family="Georgia,serif" font-size="11" font-weight="700" fill="#712B13" x="84" y="75" text-anchor="middle">User asks</text>
  <text font-family="Georgia,serif" font-size="9" fill="#854F0B" x="84" y="91" text-anchor="middle">plain language</text>
  <text font-family="Georgia,serif" font-size="9" fill="#854F0B" x="84" y="103" text-anchor="middle">question</text>
  <rect class="p1" x="26" y="51" width="116" height="60" rx="13" fill="none" stroke="#C97B3A" stroke-width="2.5" opacity="0"/>

  <!-- Arrow 1 -->
  <line x1="138" y1="81" x2="176" y2="81" stroke="#D3D1C7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="ta1" x1="138" y1="81" x2="176" y2="81" stroke="#C97B3A" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 2: POST /api/ask -->
  <rect x="178" y="55" width="128" height="52" rx="10" fill="#FDF0E4" stroke="#C97B3A" stroke-width="1"/>
  <text font-family="Georgia,serif" font-size="10" font-weight="700" fill="#712B13" x="242" y="73" text-anchor="middle">POST /api/ask</text>
  <text font-family="Georgia,serif" font-size="9" fill="#993C1D" x="242" y="89" text-anchor="middle">{ question: string }</text>
  <text font-family="Georgia,serif" font-size="9" fill="#854F0B" x="242" y="101" text-anchor="middle">Next.js route handler</text>
  <rect class="p2" x="174" y="51" width="136" height="60" rx="13" fill="none" stroke="#C97B3A" stroke-width="2.5" opacity="0"/>

  <!-- Arrow 2 -->
  <line x1="306" y1="81" x2="344" y2="81" stroke="#D3D1C7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="ta2" x1="306" y1="81" x2="344" y2="81" stroke="#3B6D11" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 3: recallPreferences -->
  <rect x="346" y="55" width="140" height="52" rx="10" fill="#E8F3EC" stroke="#3B6D11" stroke-width="1"/>
  <text font-family="Georgia,serif" font-size="10" font-weight="700" fill="#27500A" x="416" y="73" text-anchor="middle">recallPreferences()</text>
  <text font-family="Georgia,serif" font-size="9" fill="#3B6D11" x="416" y="89" text-anchor="middle">max_results: 6</text>
  <text font-family="Georgia,serif" font-size="9" fill="#3B6D11" x="416" y="101" text-anchor="middle">mode: fast</text>
  <rect class="p3" x="342" y="51" width="148" height="60" rx="13" fill="none" stroke="#3B6D11" stroke-width="2.5" opacity="0"/>

  <!-- Arrow 3 -->
  <line x1="486" y1="81" x2="524" y2="81" stroke="#D3D1C7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="ta3" x1="486" y1="81" x2="524" y2="81" stroke="#3B6D11" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 4: HydraDB + chunks -->
  <rect x="526" y="55" width="120" height="52" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text font-family="Georgia,serif" font-size="11" font-weight="700" fill="#27500A" x="586" y="73" text-anchor="middle">HydraDB</text>
  <text font-family="Georgia,serif" font-size="9" fill="#3B6D11" x="586" y="89" text-anchor="middle">semantic search</text>
  <text font-family="Georgia,serif" font-size="9" fill="#3B6D11" x="586" y="101" text-anchor="middle">top 6 chunks</text>
  <rect class="p4" x="522" y="51" width="128" height="60" rx="13" fill="none" stroke="#3B6D11" stroke-width="2.5" opacity="0"/>

  <!-- Chunk bars -->
  <rect x="534" y="122" width="104" height="13" rx="4" fill="#C0DD97"/>
  <text font-family="Georgia,serif" font-size="8" fill="#27500A" x="586" y="132" text-anchor="middle">chunk 1 · 0.94</text>
  <rect x="534" y="139" width="84" height="13" rx="4" fill="#C0DD97" opacity="0.7"/>
  <text font-family="Georgia,serif" font-size="8" fill="#27500A" x="576" y="149" text-anchor="middle">chunk 2 · 0.81</text>
  <rect x="534" y="156" width="64" height="13" rx="4" fill="#C0DD97" opacity="0.4"/>
  <text font-family="Georgia,serif" font-size="8" fill="#27500A" x="566" y="166" text-anchor="middle">chunk 3 · 0.67</text>

  <!-- Arrow 4: chunks → grounding -->
  <line x1="526" y1="148" x2="448" y2="188" stroke="#D3D1C7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="ta4" x1="526" y1="148" x2="448" y2="188" stroke="#3B6D11" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 5: Grounding -->
  <rect x="178" y="190" width="258" height="96" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text font-family="Georgia,serif" font-size="11" font-weight="700" fill="#0C447C" x="307" y="210" text-anchor="middle">Grounding constraint</text>
  <text font-family="Georgia,serif" font-size="9" fill="#185FA5" x="307" y="226" text-anchor="middle">system prompt:</text>
  <text font-family="Georgia,serif" font-size="9" font-style="italic" fill="#0C447C" x="307" y="242" text-anchor="middle">"Answer ONLY from these memories.</text>
  <text font-family="Georgia,serif" font-size="9" font-style="italic" fill="#0C447C" x="307" y="256" text-anchor="middle">Do not invent."</text>
  <text font-family="Georgia,serif" font-size="9" fill="#185FA5" x="307" y="272" text-anchor="middle">gpt-4o-mini · temperature: 0.2</text>
  <rect class="p5" x="174" y="186" width="266" height="104" rx="13" fill="none" stroke="#185FA5" stroke-width="2.5" opacity="0"/>

  <!-- Arrow 5: grounding → answer -->
  <line x1="307" y1="286" x2="307" y2="308" stroke="#D3D1C7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="ta5" x1="307" y1="286" x2="307" y2="308" stroke="#185FA5" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 6: Answer -->
  <rect x="140" y="310" width="334" height="32" rx="10" fill="#FDF0E4" stroke="#C97B3A" stroke-width="1"/>
  <text font-family="Georgia,serif" font-size="11" font-weight="700" fill="#712B13" x="307" y="330" text-anchor="middle">Grounded answer + cited sources</text>
  <rect class="p6" x="136" y="306" width="342" height="40" rx="13" fill="none" stroke="#C97B3A" stroke-width="2.5" opacity="0"/>

  <!-- No hallucination note -->
  <text font-family="Georgia,serif" font-size="9" font-style="italic" fill="#B4B2A9" x="586" y="210" text-anchor="middle">no relevant memory?</text>
  <text font-family="Georgia,serif" font-size="9" font-style="italic" fill="#993C1D" x="586" y="224" text-anchor="middle">"I don't have that"</text>
  <text font-family="Georgia,serif" font-size="9" font-style="italic" fill="#993C1D" x="586" y="238" text-anchor="middle">no hallucination</text>
</svg>
